<head>

  <style>
    header{
      background-color: #183C63;
      color: #FFFFFF;

      max-width: 800px;

    }
    main{
      background-color: #FFFFFF;

</head>
<body>
  <header>

  </header>
  <main>
    <img src="imagem-blog.png"alt="Logotipo do blog de tecnologia com ícone de chip de circuito integrado luminoso e as letras TC centralizadas em estilo pixel art. srcset="">
    <div>

      <button>❤️​ <span>0</span></button>

     </main>

<script>
    const botoes = document.querySelector("button");

    botoes.forEach( function(botao))
    botao.addEventListener("click", botaoClicado);

    function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++;
    }

</script>
